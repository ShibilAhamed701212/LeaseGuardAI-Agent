name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "18"

jobs:
  # ── Lint & Type-check Backend ────────────────────────────────
  backend-check:
    name: Backend — Type-check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Bundle
        run: npm run build

  # ── Lint & Build Frontend ───────────────────────────────────
  frontend-check:
    name: Frontend — Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Docker Compose Validation ───────────────────────────────
  docker-validate:
    name: Docker — Validate Compose Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main docker-compose
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Validate AI service docker-compose
        run: docker compose -f services/ai/docker-compose.yml config --quiet

  # ── Deploy Backend to Render (main branch only) ─────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render Deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error

      - name: Skip (deploy hook not configured)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not set; skipping Render deploy."

  # ── Deploy Frontend to Firebase Hosting (main branch only) ──
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    needs: [frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - name: Skip (service account not configured)
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret is not set; skipping Firebase deploy."

      - name: Checkout
        if: env.HAS_FIREBASE_SA == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.HAS_FIREBASE_SA == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & Build Frontend
        if: env.HAS_FIREBASE_SA == 'true'
        working-directory: frontend
        run: npm ci && npm run build

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
